<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17221e"><title>Van Ornum Renovations</title>
<style>
:root{--bg:#f2f3ef;--panel:#fff;--ink:#202a25;--muted:#6d7770;--line:#dce2dc;--green:#244b3b;--green2:#376b52;--gold:#c49a55;--danger:#a33d35;--shadow:0 8px 26px #15291a12}
[data-theme=dark]{--bg:#111916;--panel:#1b2621;--ink:#edf2ed;--muted:#a7b3aa;--line:#34433a;--green:#6caa85;--green2:#82bd98;--gold:#d9b36e;--danger:#ed8178;--shadow:0 8px 26px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:white;font-weight:650}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:var(--danger)}button.small{padding:6px 9px;font-size:13px}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:10px 0 5px}.muted{color:var(--muted)}.hidden{display:none!important}
header{background:#17251f;color:#f5f5ed;padding:18px max(20px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:3px solid #bd9657}.brand{display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;border:1px solid #bd9657;border-radius:11px;display:grid;place-items:center;color:#e0bd7d;font-size:23px}.brand h1{font:700 19px/1.2 Georgia,serif;margin:0}.brand small{color:#c4cfc7;letter-spacing:1.8px;font-size:10px}.head-actions{display:flex;gap:8px;align-items:center}.head-actions button{background:#31453a}
.shell{max-width:1240px;margin:auto;padding:22px 18px 60px}.login-wrap{max-width:440px;margin:7vh auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.login-wrap .card{padding:28px}.login-wrap h2{font:700 26px Georgia,serif;margin:0 0 5px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px;font-weight:800}.notice{padding:11px 13px;border-radius:9px;background:color-mix(in srgb,var(--gold) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 38%,var(--line));font-size:13px;margin:14px 0}
nav{display:flex;gap:7px;overflow:auto;padding:4px 0 16px;margin-bottom:16px}nav button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted)}nav button.active{background:var(--green);color:white;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat{padding:16px}.stat strong{display:block;font-size:25px;line-height:1.2;margin-top:5px}.stat span{font-size:12px;color:var(--muted);font-weight:650}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;flex-wrap:wrap}.section-head h2,.section-head h3{margin:0;font:700 21px Georgia,serif}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;background:color-mix(in srgb,var(--bg) 70%,var(--panel))}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:color-mix(in srgb,var(--green2) 15%,var(--panel));color:var(--green2);font-size:11px;font-weight:750}.job-card{padding:16px}.job-card h3{margin:0 0 3px;font-size:16px}.job-card p{margin:3px 0;color:var(--muted);font-size:13px}.job-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}.message{padding:12px;border:1px solid var(--line);border-radius:9px;margin:9px 0}.message p{margin:5px 0}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17251f;color:white;padding:11px 18px;border-radius:9px;box-shadow:var(--shadow);z-index:10}.invoice-paper{background:#fff;color:#222;padding:32px;max-width:850px;margin:18px auto;border:1px solid #ddd;font-family:Arial,sans-serif}.invoice-top{display:flex;justify-content:space-between;gap:20px}.invoice-top h1{font:700 26px Georgia,serif;margin:0}.invoice-top p{margin:2px 0;font-size:12px}.invoice-paper table{min-width:0}.invoice-paper th{background:#f0f1ee;color:#333}.invoice-paper td,.invoice-paper th{color:#222;border-color:#ddd}.invoice-totals{margin-left:auto;width:min(300px,100%)}.invoice-totals div{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #ddd}.invoice-totals .total{font-size:19px;font-weight:800;border:0}.invoice-footer{text-align:center;margin-top:30px;font:italic 13px Georgia,serif}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:560px){.shell{padding:14px 12px 40px}.grid{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.job-list,.three{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px}.invoice-paper{padding:16px}.invoice-top{flex-direction:column}}
@media print{body{background:white!important}.no-print,header,nav,.shell>.section-head,.invoice-tools{display:none!important}.shell{padding:0;max-width:none}.invoice-paper{border:0;margin:0;max-width:none;padding:12mm;box-shadow:none;print-color-adjust:exact}}
</style></head>
<body>
<header><div class="brand"><div class="mark">⌂</div><div><h1>Van Ornum Renovations</h1><small>CRAFT · CARE · COMMITMENT</small></div></div><div class="head-actions"><span id="user-label" class="muted"></span><button class="small" id="theme-btn">☾ Theme</button><button class="small hidden" id="logout-btn">Log out</button></div></header>
<main class="shell">
<section id="login-view" class="login-wrap"><div class="card"><div class="eyebrow">PROJECT & WORKFORCE PORTAL</div><form id="login-form"><label>Username</label><input id="login-user" autocomplete="username" required><label>Password</label><input id="login-pass" type="password" autocomplete="current-password" required><div class="actions"><button type="submit" style="width:100%">Sign in</button></div></form><div id="login-error" class="muted" role="status"></div></div></section>
<section id="app-view" class="hidden"><nav id="nav"></nav><div id="view"></div></section>
</main><div id="toast" class="toast hidden"></div>
<script>
const KEY='vanOrnumRenovations_v1', THEME='vanOrnumTheme';
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,session=null,tab='dashboard',timerTick=null;
const fresh=()=>({users:[{id:'owner',name:'DVO',username:'DVO',role:'employer',salt:'dvo-initial-salt',passwordHash:'',active:true,changeRequired:true}],jobs:[],timeEntries:[],expenses:[],invoices:[],messages:[],payments:[]});
async function hash(p,s){const input=s+'|'+p;try{if(globalThis.crypto&&crypto.subtle){const bytes=new TextEncoder().encode(input);const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(err){}let h=2166136261;for(let i=0;i<input.length;i++){h^=input.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
function init(){try{db=JSON.parse(localStorage.getItem(KEY)||'null')||fresh();if(!db.users||!db.users.length)db=fresh();if(!db.users[0].passwordHash)db.users[0].passwordHash='';save();applyTheme();$('#theme-btn').onclick=toggleTheme;$('#login-form').addEventListener('submit',login);$('#logout-btn').onclick=logout;$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});const savedId=sessionStorage.getItem('vanOrnumSession');if(savedId){const savedUser=db.users.find(u=>u.id===savedId&&u.active);if(savedUser){session=savedUser;$('#login-view').classList.add('hidden');$('#app-view').classList.remove('hidden');$('#logout-btn').classList.remove('hidden');$('#user-label').textContent=savedUser.name;tab=savedUser.changeRequired?'account':(savedUser.role==='employer'?'dashboard':'clock');render()}else sessionStorage.removeItem('vanOrnumSession')}}catch(error){console.error(error);$('#login-error').textContent='App initialization failed: '+error.message}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2400)}
function applyTheme(){document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';$('#theme-btn').textContent=document.documentElement.dataset.theme==='dark'?'☀ Light':'☾ Dark'}
function toggleTheme(){localStorage.setItem(THEME,document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()}
async function login(e){e.preventDefault();let err=$('#login-error');err.textContent='Checking login…';try{let username=$('#login-user').value.trim().toLowerCase(),entered=$('#login-pass').value;let u=db.users.find(x=>x.active&&x.username.toLowerCase()===username);if(!u){err.textContent='Username or password is incorrect.';return}let valid=!!u.passwordHash&&u.passwordHash===await hash(entered,u.salt);if(!valid&&username==='dvo'&&entered==='admin'&&u.changeRequired){u.salt='dvo-initial-salt';u.passwordHash=await hash('admin',u.salt);valid=true;save()}if(!valid){err.textContent='Username or password is incorrect.';return}session=u;sessionStorage.setItem('vanOrnumSession',u.id);$('#login-error').textContent='';$('#login-view').classList.add('hidden');$('#app-view').classList.remove('hidden');$('#logout-btn').classList.remove('hidden');$('#user-label').textContent=u.name;tab=u.changeRequired?'account':(u.role==='employer'?'dashboard':'clock');render();if(u.changeRequired)toast('Please change your initial password.')}catch(error){console.error(error);err.textContent='Login could not be completed. Please refresh the page and try again.'}}
function logout(){if(timerTick)clearInterval(timerTick);sessionStorage.removeItem('vanOrnumSession');session=null;$('#app-view').classList.add('hidden');$('#login-view').classList.remove('hidden');$('#logout-btn').classList.add('hidden');$('#user-label').textContent='';$('#login-form').reset()}
function navItems(){return session.role==='employer'?[['dashboard','Overview'],['jobs','Jobs'],['employees','Employees'],['time','Time'],['expenses','Expenses'],['invoices','Invoices'],['payments','Payments'],['messages','Inbox'],['reports','Reports'],['account','Account']]:[['clock','Clock in/out'],['jobs','My jobs'],['messages','Inbox'],['account','Account']]}
function render(){let items=navItems();$('#nav').innerHTML=items.map(([id,n])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+n+'</button>').join('');let f={dashboard:dashboard,jobs:jobs,employees:employees,time:timeView,expenses:expenses,invoices:invoices,payments:payments,messages:messages,reports:reports,account:account,clock:clockView};$('#view').innerHTML=(f[tab]||dashboard)();bind();if(tab==='clock')startTimerRefresh()}
function sum(a,fn){return a.reduce((s,x)=>s+(Number(fn(x))||0),0)}
function dashboard(){let active=db.jobs.filter(j=>j.status!=='Completed').length, hours=sum(db.timeEntries.filter(t=>!t.end),t=>0)+sum(db.timeEntries.filter(t=>t.end),t=>(new Date(t.end)-new Date(t.start))/36e5), billed=sum(db.invoices,i=>i.total),paid=sum(db.payments,p=>p.amount),cost=sum(db.expenses,x=>x.amount);return '<div class="grid"><div class="card stat"><span>ACTIVE JOBS</span><strong>'+active+'</strong></div><div class="card stat"><span>RECORDED HOURS</span><strong>'+hours.toFixed(1)+'</strong></div><div class="card stat"><span>INVOICED</span><strong>'+money(billed)+'</strong></div><div class="card stat"><span>PAYMENTS RECEIVED</span><strong>'+money(paid)+'</strong></div></div><div class="section-head"><h2>Business overview</h2><button data-go="jobs">＋ Add job</button></div><div class="two"><div class="card"><h3>Recent jobs</h3>'+ (db.jobs.length?db.jobs.slice(-5).reverse().map(j=>'<div class="message"><b>'+esc(j.name)+'</b><p>'+esc(j.customer)+' · '+esc(j.status)+'</p></div>').join(''):'<div class="empty">No jobs yet. Add your first customer job.</div>')+'</div><div class="card"><h3>Financial snapshot</h3><p class="muted">Expenses recorded</p><h2>'+money(cost)+'</h2><p class="muted">Outstanding invoice balance</p><h2>'+money(Math.max(0,billed-paid))+'</h2><p class="muted">Payments and invoices are tracked separately; allocate payments to invoices in Payments.</p></div></div>'}
function jobs(){let mine=session.role==='employer'?db.jobs:db.jobs.filter(j=>(j.employeeIds||[]).includes(session.id));return '<div class="section-head"><h2>Customer jobs</h2>'+(session.role==='employer'?'<button data-action="new-job">＋ New job</button>':'')+'</div><div class="job-list">'+(mine.length?mine.map(j=>'<div class="card job-card"><h3>'+esc(j.name)+'</h3><p>'+esc(j.customer)+' · '+esc(j.location||'')+'</p><p>'+esc(j.description||'')+'</p><p><span class="pill">'+esc(j.status)+'</span></p><p>Employees: '+(j.employeeIds||[]).map(id=>esc(db.users.find(u=>u.id===id)?.name||'')).join(', ')+'</p>'+(session.role==='employer'?'<div class="actions"><button class="small secondary" data-edit-job="'+j.id+'">Edit</button><button class="small danger" data-delete-job="'+j.id+'">Delete</button></div>':'')+'</div>').join(''):'<div class="card empty">No jobs assigned yet.</div>')+'</div>'}
function employees(){let users=db.users.filter(u=>u.role==='employee');return '<div class="section-head"><h2>Employees</h2><button data-action="new-employee">＋ Add employee</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+users.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td>'+(u.active?'<span class="pill">Active</span>':'Inactive')+'</td><td><button class="small secondary" data-reset-user="'+u.id+'">Set password</button> <button class="small secondary" data-message-user="'+u.id+'">Message</button> <button class="small danger" data-remove-user="'+u.id+'">'+(u.active?'Remove':'Reactivate')+'</button></td></tr>').join('')+'</tbody></table></div></div><details class="card" open style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">Inbox</summary>'+messages().replace(/^<div class="section-head"><h2>Inbox<\/h2>[^<]*<\/div>/,'')+'</details>'}
function timeView(){
  const groups=new Map();
  db.timeEntries.forEach(t=>{
    const d=new Date(t.start);
    const dayKey=isNaN(d)?'Unknown date':[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
    const key=dayKey+'|'+t.jobId;
    if(!groups.has(key))groups.set(key,{dayKey,jobId:t.jobId,entries:[],hours:0,open:0});
    const g=groups.get(key);g.entries.push(t);
    if(t.end)g.hours+=(new Date(t.end)-new Date(t.start))/36e5;else g.open++;
  });
  const sorted=[...groups.values()].sort((a,b)=>b.dayKey.localeCompare(a.dayKey)||String(a.jobId).localeCompare(String(b.jobId)));
  const rows=sorted.map(g=>{
    const job=db.jobs.find(j=>j.id===g.jobId);
    const day=g.dayKey==='Unknown date'?'Unknown date':new Date(g.dayKey+'T12:00:00').toLocaleDateString();
    const detail=g.entries.slice().sort((a,b)=>new Date(a.start)-new Date(b.start)).map(t=>{
      const employee=db.users.find(u=>u.id===t.userId)?.name||'Former employee';
      const hours=t.end?((new Date(t.end)-new Date(t.start))/36e5).toFixed(2)+' hrs':'In progress';
      return '<tr class="time-detail"><td></td><td>↳ '+esc(employee)+'</td><td>'+fmt(t.start)+'</td><td>'+(t.end?fmt(t.end):'<span class="pill">Clocked in</span>')+'</td><td>'+hours+'</td></tr>';
    }).join('');
    return '<tr class="time-group"><td><b>'+esc(day)+'</b></td><td><b>'+esc(job?.name||'Deleted job')+'</b></td><td colspan="2">'+g.entries.length+' record(s)'+(g.open?' · '+g.open+' open':'')+'</td><td><b>'+g.hours.toFixed(2)+' hrs</b></td></tr>'+detail;
  }).join('');
  return '<div class="section-head"><h2>Time by day & job</h2></div><div class="card"><p class="muted">Hours are grouped by the day the shift started and the job worked. Open shifts are listed separately and are not included in completed-hour totals.</p><div class="table-wrap"><table><thead><tr><th>Day</th><th>Job / Employee</th><th>Clock in</th><th>Clock out</th><th>Hours</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="empty">No time records yet.</td></tr>')+'</tbody></table></div></div>';
}
function clockView(){let open=db.timeEntries.find(t=>t.userId===session.id&&!t.end),assigned=db.jobs.filter(j=>j.status!=='Completed'&&(session.role==='employer'||(j.employeeIds||[]).includes(session.id)));return '<div class="section-head"><h2>Time clock</h2></div><div class="card" style="max-width:650px"><div class="eyebrow">EMPLOYEE TIME TRACKING</div>'+(open?'<p class="muted">Currently clocked in on</p><h2>'+esc(db.jobs.find(j=>j.id===open.jobId)?.name||'Job')+'</h2><div class="timer" id="elapsed">00:00:00</div><p class="muted">Started '+fmt(open.start)+'</p><button class="danger" data-action="clock-out">Clock out</button>':'<p class="muted">Select the job you are working on to begin tracking time.</p><label>Job</label><select id="clock-job"><option value="">Choose a job</option>'+assigned.map(j=>'<option value="'+j.id+'">'+esc(j.name)+' — '+esc(j.customer)+'</option>').join('')+'</select><div class="actions"><button data-action="clock-in">Clock in</button></div>')+'</div><div class="notice">Clock-in records are saved on this device. Keep this browser open while working; clock-out uses the saved start time.</div>'}
function expenses(){return '<div class="section-head"><h2>Expenses & materials</h2><button data-action="new-expense">＋ Record expense</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Job</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+db.expenses.slice().reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(db.jobs.find(j=>j.id===x.jobId)?.name||'General')+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function invoices(){return '<div class="section-head"><h2>Invoices</h2><button data-action="new-invoice">＋ Create invoice</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Job</th><th>Date</th><th>Total</th><th>Actions</th></tr></thead><tbody>'+db.invoices.slice().reverse().map(i=>'<tr><td>'+esc(i.number)+'</td><td>'+esc(i.customer)+'</td><td>'+esc(i.jobName)+'</td><td>'+esc(i.date)+'</td><td>'+money(i.total)+'</td><td><button class="small secondary" data-view-invoice="'+i.id+'">View / PDF</button></td></tr>').join('')+'</tbody></table></div></div>'}
function payments(){return '<div class="section-head"><h2>Payments</h2><button data-action="new-payment">＋ Record payment</button></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Method</th><th>Reference</th><th>Amount</th></tr></thead><tbody>'+db.payments.slice().reverse().map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(db.invoices.find(i=>i.id===p.invoiceId)?.number||'Unassigned')+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference||'')+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function messages(){let mine=db.messages.filter(m=>session.role==='employer'||m.to===session.id||m.from===session.id);return '<div class="section-head"><h2>Inbox</h2>'+(session.role==='employer'?'<button data-action="new-message">＋ New message</button>':'')+'</div><div class="card">'+(mine.length?mine.slice().reverse().map(m=>'<div class="message"><b>'+esc(m.subject)+'</b><p>'+esc(m.body)+'</p><small class="muted">From '+esc(db.users.find(u=>u.id===m.from)?.name||'Employer')+' · To '+esc(m.to==='all'?'All employees':db.users.find(u=>u.id===m.to)?.name||'')+' · '+fmt(m.date)+'</small></div>').join(''):'<div class="empty">Your inbox is empty.</div>')+'</div>'}
function reports(){return '<div class="section-head"><h2>Reports</h2></div><div class="grid"><div class="card stat"><span>LABOR HOURS</span><strong>'+sum(db.timeEntries.filter(t=>t.end),t=>(new Date(t.end)-new Date(t.start))/36e5).toFixed(1)+'</strong></div><div class="card stat"><span>EXPENSES</span><strong>'+money(sum(db.expenses,x=>x.amount))+'</strong></div><div class="card stat"><span>INVOICES</span><strong>'+db.invoices.length+'</strong></div><div class="card stat"><span>PAYMENTS</span><strong>'+money(sum(db.payments,p=>p.amount))+'</strong></div></div><div class="card" style="margin-top:14px"><h3>Export reports</h3><p class="muted">Generate print-ready reports and choose “Save as PDF” in your browser print dialog.</p><div class="actions"><button data-report="labor">Labor report</button><button data-report="materials">Materials & expenses</button><button data-report="financial">Invoices & payments</button><button class="secondary" data-report="all">Full business report</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Data backup</h3><p class="muted">Download a copy of this browser records before clearing browser data or changing devices.</p><button class="secondary" data-action="backup">Export data backup (JSON)</button><label>Restore backup</label><input type="file" id="restore-file" accept="application/json"></div>'}
function account(){return '<div class="section-head"><h2>Account & security</h2></div><div class="card" style="max-width:600px"><p>Signed in as <b>'+esc(session.name)+'</b> ('+esc(session.role)+')</p><form id="password-form"><label>Current password</label><input id="old-pass" type="password" required><label>New password</label><input id="new-pass" type="password" minlength="8" required><label>Confirm new password</label><input id="confirm-pass" type="password" minlength="8" required><div class="actions"><button>Change password</button></div></form><div class="notice">Passwords are hashed before being stored in this browser. This is a local, single-device prototype—not a secure multi-user server. See README for deployment and security limitations.</div></div>'}
function fmt(d){return d?new Date(d).toLocaleString():'—'}
function bind(){
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
document.querySelectorAll('[data-edit-job]').forEach(b=>b.onclick=()=>jobForm(db.jobs.find(j=>j.id===b.dataset.editJob)));
document.querySelectorAll('[data-delete-job]').forEach(b=>b.onclick=()=>{if(confirm('Delete this job? Existing time and invoice history will remain.')){db.jobs=db.jobs.filter(j=>j.id!==b.dataset.deleteJob);save();render()}});
document.querySelectorAll('[data-reset-user]').forEach(b=>b.onclick=()=>resetUser(b.dataset.resetUser));
document.querySelectorAll('[data-remove-user]').forEach(b=>b.onclick=()=>{let u=db.users.find(x=>x.id===b.dataset.removeUser);u.active=!u.active;save();render()});
document.querySelectorAll('[data-message-user]').forEach(b=>b.onclick=()=>messageForm(b.dataset.messageUser));
document.querySelectorAll('[data-view-invoice]').forEach(b=>viewInvoice(b.dataset.viewInvoice));
document.querySelectorAll('[data-report]').forEach(b=>report(b.dataset.report));
let pf=$('#password-form');if(pf)pf.onsubmit=changePassword;
let rf=$('#restore-file');if(rf)rf.onchange=restore;
}
function modalForm(title,body,submit){let v=$('#view');v.insertAdjacentHTML('afterbegin','<div class="card" id="editor" style="margin-bottom:16px;border:2px solid var(--gold)"><div class="section-head"><h3>'+title+'</h3><button class="small secondary" id="close-editor">Close</button></div>'+body+'</div>');$('#close-editor').onclick=()=>$('#editor').remove();let f=$('#editor form');if(f)f.onsubmit=async e=>{e.preventDefault();await submit(new FormData(f));}}
function jobForm(j){let editing=!!j;modalForm(editing?'Edit job':'Create customer job','<form><div class="form-grid"><div><label>Job name</label><input name="name" required value="'+esc(j?.name||'')+'"></div><div><label>Customer</label><input name="customer" required value="'+esc(j?.customer||'')+'"></div><div><label>Location</label><input name="location" value="'+esc(j?.location||'')+'"></div><div><label>Status</label><select name="status">'+['Quoted','Scheduled','In progress','On hold','Completed'].map(s=>'<option '+(j?.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="full"><label>Description / scope</label><textarea name="description">'+esc(j?.description||'')+'</textarea></div><div class="full"><label>Assign employees</label><div class="form-grid">'+db.users.filter(u=>u.role==='employee'&&u.active).map(u=>'<label><input style="width:auto" type="checkbox" name="employeeIds" value="'+u.id+'" '+((j?.employeeIds||[]).includes(u.id)?'checked':'')+'> '+esc(u.name)+'</label>').join('')+'</div></div></div><div class="actions"><button>Save job</button></div></form>',fd=>{let x={id:j?.id||crypto.randomUUID(),name:fd.get('name'),customer:fd.get('customer'),location:fd.get('location'),status:fd.get('status'),description:fd.get('description'),employeeIds:fd.getAll('employeeIds')};if(editing)db.jobs[db.jobs.findIndex(a=>a.id===j.id)]=x;else db.jobs.push(x);save();render();toast('Job saved')})}
function employeeForm(){modalForm('Add employee','<form><div class="form-grid"><div><label>Employee name</label><input name="name" required></div><div><label>Username</label><input name="username" required></div><div class="full"><label>Initial password</label><input name="password" minlength="8" required><small class="muted">Employee can change this after signing in.</small></div></div><div class="actions"><button>Add employee</button></div></form>',async fd=>{let username=fd.get('username').trim();if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return alert('That username is already in use.');let salt=crypto.randomUUID();db.users.push({id:crypto.randomUUID(),name:fd.get('name'),username,role:'employee',salt,passwordHash:await hash(fd.get('password'),salt),active:true,changeRequired:true});save();render();toast('Employee added')})}
async function resetUser(id){let u=db.users.find(x=>x.id===id),p=prompt('Set a temporary password for '+u.name+' (at least 8 characters):');if(p===null)return;if(p.length<8)return alert('Use at least 8 characters.');u.salt=crypto.randomUUID();u.passwordHash=await hash(p,u.salt);u.changeRequired=true;save();toast('Password reset. Share it securely with the employee.')}
function messageForm(to=''){modalForm('Send inbox message','<form><label>Recipient</label><select name="to"><option value="all">All employees</option>'+db.users.filter(u=>u.role==='employee'&&u.active).map(u=>'<option value="'+u.id+'" '+(to===u.id?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select><label>Subject</label><input name="subject" required><label>Message</label><textarea name="body" required rows="4"></textarea><div class="actions"><button>Send message</button></div></form>',fd=>{db.messages.push({id:crypto.randomUUID(),from:session.id,to:fd.get('to'),subject:fd.get('subject'),body:fd.get('body'),date:new Date().toISOString()});save();render();toast('Message sent')})}
function expenseForm(){modalForm('Record expense or materials','<form><div class="form-grid"><div><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div><div><label>Job</label><select name="jobId"><option value="">General / overhead</option>'+db.jobs.map(j=>'<option value="'+j.id+'">'+esc(j.name)+'</option>').join('')+'</select></div><div><label>Category</label><select name="category"><option>Materials</option><option>Labor</option><option>Equipment</option><option>Travel</option><option>Permit</option><option>Other</option></select></div><div><label>Amount ($)</label><input name="amount" type="number" min="0" step=".01" required></div><div class="full"><label>Description / vendor</label><input name="description" required></div></div><div class="actions"><button>Save expense</button></div></form>',fd=>{db.expenses.push({id:crypto.randomUUID(),date:fd.get('date'),jobId:fd.get('jobId'),category:fd.get('category'),amount:+fd.get('amount'),description:fd.get('description')});save();render()})}
function invoiceForm(){modalForm('Create professional invoice','<form id="invoice-editor"><div class="form-grid"><div><label>Invoice number</label><input name="number" value="VO-'+String(db.invoices.length+1).padStart(4,'0')+'" required></div><div><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div><div><label>Customer / Invoice to</label><input name="customer" required></div><div><label>Customer address</label><input name="address"></div><div><label>Salesperson</label><input name="salesperson"></div><div><label>Job</label><select name="jobId"><option value="">Select job (optional)</option>'+db.jobs.map(j=>'<option value="'+j.id+'">'+esc(j.name)+'</option>').join('')+'</select></div><div><label>Payment terms</label><input name="terms" value="Due upon receipt"></div><div><label>Sales tax (%)</label><input name="tax" type="number" min="0" step=".01" value="0"></div></div><h3 style="margin-top:20px">Line items</h3><div id="line-items"></div><button type="button" class="secondary small" id="add-line">＋ Add line</button><div class="actions"><button>Create invoice</button></div></form>');let lines=$('#line-items');const add=()=>{let r=document.createElement('div');r.className='form-grid line-row';r.style.borderBottom='1px solid var(--line)';r.style.paddingBottom='8px';r.innerHTML='<div><label>Quantity</label><input name="qty" type="number" min="0" step=".01" value="1" required></div><div><label>Description</label><input name="desc" required></div><div><label>Unit price ($)</label><input name="price" type="number" min="0" step=".01" value="0" required></div><div class="actions"><button type="button" class="small danger remove-line">Remove line</button></div>';r.querySelector('.remove-line').onclick=()=>r.remove();lines.append(r)};add();$('#add-line').onclick=add;$('#invoice-editor').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),items=[...lines.querySelectorAll('.line-row')].map(r=>({qty:+r.querySelector('[name=qty]').value,description:r.querySelector('[name=desc]').value,price:+r.querySelector('[name=price]').value}));if(!items.length)return alert('Add at least one line item.');let subtotal=sum(items,x=>x.qty*x.price),tax=subtotal*(+fd.get('tax')||0)/100,job=db.jobs.find(j=>j.id===fd.get('jobId'));let inv={id:crypto.randomUUID(),number:fd.get('number'),date:fd.get('date'),customer:fd.get('customer'),address:fd.get('address'),salesperson:fd.get('salesperson'),jobId:fd.get('jobId'),jobName:job?.name||'',terms:fd.get('terms'),items,subtotal,tax,taxRate:+fd.get('tax')||0,total:subtotal+tax};db.invoices.push(inv);save();render();viewInvoice(inv.id)}}
function invoiceMarkup(i){return '<div class="invoice-paper"><div class="invoice-top"><div><div class="eyebrow" style="color:#9a7741">INVOICE</div><h1>Van Ornum Renovations</h1></div><div style="text-align:right"><p>571 Tazewell Pike</p><p>Luttrell, TN 37779</p><p>865-556-9480</p><p>dvanornum68@gmail.com</p></div></div><hr style="border:0;border-top:2px solid #263e32;margin:22px 0"><div class="invoice-top"><div><b>INVOICE TO</b><p>'+esc(i.customer)+'</p><p>'+esc(i.address||'')+'</p></div><div><p><b>INVOICE #</b> '+esc(i.number)+'</p><p><b>DATE</b> '+esc(i.date)+'</p><p><b>SALESPERSON</b> '+esc(i.salesperson||'')+'</p><p><b>JOB</b> '+esc(i.jobName)+'</p><p><b>PAYMENT TERMS</b> '+esc(i.terms||'Due upon receipt')+'</p><p><b>DUE DATE</b> Due upon receipt</p></div></div><table style="margin-top:28px"><thead><tr><th>QUANTITY</th><th>DESCRIPTION</th><th>UNIT PRICE</th><th>LINE TOTAL</th></tr></thead><tbody>'+i.items.map(x=>'<tr><td>'+x.qty+'</td><td>'+esc(x.description)+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td></tr>').join('')+'</tbody></table><div class="invoice-totals"><div><span>Subtotal</span><b>'+money(i.subtotal)+'</b></div><div><span>Sales Tax ('+i.taxRate+'%)</span><b>'+money(i.tax)+'</b></div><div class="total"><span>TOTAL</span><b>'+money(i.total)+'</b></div></div><div class="invoice-footer">Revelation 14:12</div></div>'}
function viewInvoice(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;$('#view').innerHTML='<div class="section-head no-print"><h2>Invoice '+esc(i.number)+'</h2><div class="actions invoice-tools"><button onclick="window.print()">Print / Save PDF</button><button class="secondary" id="back-invoices">Back to invoices</button></div></div>'+invoiceMarkup(i);$('#back-invoices').onclick=()=>{tab='invoices';render()}}
function action(a){if(a==='new-job')jobForm();if(a==='new-employee')employeeForm();if(a==='new-expense')expenseForm();if(a==='new-invoice')invoiceForm();if(a==='new-payment')paymentForm();if(a==='new-message')messageForm();if(a==='clock-in'){let jobId=$('#clock-job').value;if(!jobId)return alert('Choose a job first.');if(db.timeEntries.some(t=>t.userId===session.id&&!t.end))return alert('You are already clocked in.');db.timeEntries.push({id:crypto.randomUUID(),userId:session.id,jobId,start:new Date().toISOString(),end:null});save();render();toast('Clocked in')}if(a==='clock-out'){let t=db.timeEntries.find(t=>t.userId===session.id&&!t.end);if(t){t.end=new Date().toISOString();save();render();toast('Clocked out')}}if(a==='backup'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='van-ornum-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}}
function paymentForm(){modalForm('Record payment','<form><label>Invoice</label><select name="invoiceId" required>'+db.invoices.map(i=>'<option value="'+i.id+'">'+esc(i.number)+' — '+esc(i.customer)+' ('+money(i.total)+')</option>').join('')+'</select><div class="form-grid"><div><label>Date</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div><div><label>Amount ($)</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>Method</label><select name="method"><option>Cash</option><option>Check</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></div><div><label>Reference / notes</label><input name="reference"></div></div><div class="actions"><button>Save payment</button></div></form>',fd=>{db.payments.push({id:crypto.randomUUID(),invoiceId:fd.get('invoiceId'),date:fd.get('date'),amount:+fd.get('amount'),method:fd.get('method'),reference:fd.get('reference')});save();render()})}
async function changePassword(e){e.preventDefault();let old=$('#old-pass').value,n=$('#new-pass').value;if(n!==$('#confirm-pass').value)return alert('New passwords do not match.');if(n.length<8)return alert('Use at least 8 characters.');if(session.passwordHash!==await hash(old,session.salt))return alert('Current password is incorrect.');session.salt=crypto.randomUUID();session.passwordHash=await hash(n,session.salt);session.changeRequired=false;save();$('#password-form').reset();toast('Password changed successfully')}
function report(type){let title={labor:'Labor report',materials:'Materials & expenses report',financial:'Invoices & payments report',all:'Business report'}[type],content='';if(type==='labor'||type==='all')content+='<h2>Labor</h2><table><tr><th>Employee</th><th>Job</th><th>Start</th><th>End</th><th>Hours</th></tr>'+db.timeEntries.map(t=>'<tr><td>'+esc(db.users.find(u=>u.id===t.userId)?.name||'')+'</td><td>'+esc(db.jobs.find(j=>j.id===t.jobId)?.name||'')+'</td><td>'+fmt(t.start)+'</td><td>'+fmt(t.end)+'</td><td>'+(t.end?((new Date(t.end)-new Date(t.start))/36e5).toFixed(2):'Open')+'</td></tr>').join('')+'</table>';if(type==='materials'||type==='all')content+='<h2>Materials & expenses</h2><table><tr><th>Date</th><th>Job</th><th>Category</th><th>Description</th><th>Amount</th></tr>'+db.expenses.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(db.jobs.find(j=>j.id===x.jobId)?.name||'General')+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</table><p><b>Total expenses: '+money(sum(db.expenses,x=>x.amount))+'</b></p>';if(type==='financial'||type==='all')content+='<h2>Invoices</h2><table><tr><th>Number</th><th>Customer</th><th>Job</th><th>Date</th><th>Total</th></tr>'+db.invoices.map(i=>'<tr><td>'+esc(i.number)+'</td><td>'+esc(i.customer)+'</td><td>'+esc(i.jobName)+'</td><td>'+esc(i.date)+'</td><td>'+money(i.total)+'</td></tr>').join('')+'</table><h2>Payments</h2><table><tr><th>Date</th><th>Invoice</th><th>Method</th><th>Amount</th></tr>'+db.payments.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(db.invoices.find(i=>i.id===p.invoiceId)?.number||'')+'</td><td>'+esc(p.method)+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</table>';let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print reports.');w.document.write('<html><head><title>'+title+'</title><style>body{font:13px Arial;padding:28px;color:#222}h1{font:26px Georgia}h2{margin-top:28px;color:#294c3b}table{width:100%;border-collapse:collapse;margin:10px 0 20px}td,th{padding:8px;border:1px solid #ddd;text-align:left}th{background:#eee}small{color:#777}</style></head><body><h1>Van Ornum Renovations</h1><h2>'+title+'</h2><small>Generated '+new Date().toLocaleString()+'</small>'+content+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function startTimerRefresh(){if(timerTick)clearInterval(timerTick);let tick=()=>{let t=db.timeEntries.find(t=>t.userId===session.id&&!t.end),el=$('#elapsed');if(t&&el){let s=Math.max(0,Math.floor((Date.now()-new Date(t.start))/1000));el.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}};tick();timerTick=setInterval(tick,1000)}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.users||!d.jobs||!confirm('Replace all current local data with this backup?'))return;db=d;save();render();toast('Backup restored')}catch{alert('That backup file could not be read.')}};r.readAsText(file)}
init();
</script></body></html>
